plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    serverOnlyMinecraftJar()
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation include("net.kyori:adventure-text-minimessage:${project.adventure_version}")
    implementation include("net.kyori:adventure-api:${project.adventure_version}")
    implementation include("net.kyori:adventure-key:${project.adventure_version}")
    implementation include("net.kyori:examination-api:1.3.0")
    implementation include("net.kyori:examination-string:1.3.0")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
    from("LICENSE")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
